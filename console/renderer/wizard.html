<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>OAS Studio · 启动配置</title>
<style>
  :root {
    --bg: #f7f5f1; --panel: #ffffff; --line: #e7e1d8; --text: #24211d;
    --text-2: #57514a; --text-3: #857d71; --accent: #b8491f;
    --accent-2: #993a16;
    --ok: #2e7a52; --err: #b02a30;
    --ok-soft: rgba(46, 122, 82, 0.10); --err-soft: rgba(176, 42, 48, 0.10);
    --radius: 10px; --sans: -apple-system, "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 22px 24px 20px; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 13px; line-height: 1.55;
    display: flex; flex-direction: column; min-height: 100vh; overflow-y: auto;
  }
  .logo { display: flex; align-items: center; gap: 9px; margin-bottom: 2px; }
  .logo .mark {
    width: 28px; height: 28px; border-radius: 8px; background: var(--accent);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px;
  }
  h1 { font-size: 15px; margin: 0; }
  .sub { color: var(--text-3); font-size: 12px; margin: 2px 0 14px; }
  .status-line { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #c9bfb2; flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--err); }
  .status-text { font-size: 12.5px; color: var(--text-2); }
  .bar { height: 7px; border-radius: 99px; background: #efe9df; overflow: hidden; margin: 10px 0; }
  .bar > div { height: 100%; width: 0%; background: var(--accent); transition: width .2s; }
  .bar.indeterminate > div { width: 100%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .msg { font-size: 12px; margin: 6px 0 0; color: var(--text-3); word-break: break-all; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .row > button { flex: 1; min-width: 0; }
  button {
    font-family: var(--sans); font-size: 12.5px; border-radius: 7px; cursor: pointer;
    padding: 8px 14px; border: 1px solid transparent;
  }
  .primary { background: var(--accent); color: #fff; }
  .primary:hover { background: var(--accent-2); }
  .primary:disabled { background: #c9bfb2; cursor: not-allowed; }
  .ghost { background: transparent; color: var(--text-2); border-color: var(--line); }
  input.url {
    flex: 1; min-width: 100%; font-family: Consolas, monospace; font-size: 11px;
    padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: #fff;
    color: var(--text-2);
  }
  .hint { color: var(--text-3); font-size: 11px; margin-top: 12px; line-height: 1.5; }
  /* 进入控制台：底部通栏主按钮 */
  .footer { margin-top: auto; padding-top: 16px; }
  #startBtn {
    width: 100%; font-size: 14px; padding: 11px 0; font-weight: 600;
    letter-spacing: 1px; border-radius: 9px;
  }
</style>
</head>
<body>
  <div class="logo"><div class="mark">OAS</div><h1>启动配置</h1></div>
  <div class="sub">首次使用需安装 Python 运行环境（约 350 MB，只装一次）。</div>

  <div class="status-line">
    <div class="dot" id="dot"></div>
    <span class="status-text" id="statusText">检查中…</span>
  </div>
  <div class="bar" id="bar" hidden><div id="barFill"></div></div>
  <div class="msg" id="msg" hidden></div>

  <div class="row" id="actions" hidden>
    <input class="url" id="url" placeholder="下载地址（可换成镜像）" />
  </div>
  <div class="row" id="actions2" hidden>
    <button class="primary" id="downloadBtn">自动下载并安装</button>
    <button class="ghost" id="zipBtn">从本地 zip 安装</button>
  </div>

  <div class="hint" id="hint" hidden>
    正在解压（约 650 MB），可能需要一两分钟。解压在后台进行，若界面短暂无响应请耐心等待，不要强制关闭。
  </div>

  <div class="footer">
    <button class="primary" id="startBtn" disabled>进入控制台</button>
  </div>

<script>
  const rt = window.oasDesktop.runtime;

  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  const bar = document.getElementById('bar');
  const barFill = document.getElementById('barFill');
  const msg = document.getElementById('msg');
  const actions = document.getElementById('actions');
  const actions2 = document.getElementById('actions2');
  const url = document.getElementById('url');
  const downloadBtn = document.getElementById('downloadBtn');
  const zipBtn = document.getElementById('zipBtn');
  const startBtn = document.getElementById('startBtn');
  const hint = document.getElementById('hint');

  function setMsg(text, cls) {
    msg.hidden = false; msg.className = 'msg' + (cls ? ' ' + cls : ''); msg.textContent = text;
  }

  async function refresh() {
    const st = await rt.status();
    url.value = st.defaultUrl;
    if (st.installed) {
      dot.className = 'dot ok';
      statusText.textContent = '运行环境已就绪' + (st.version ? '（v' + st.version + '）' : '');
      actions.hidden = true; actions2.hidden = true; bar.hidden = true; hint.hidden = true;
      startBtn.disabled = false;
    } else {
      dot.className = 'dot bad';
      statusText.textContent = '运行环境未安装';
      actions.hidden = false; actions2.hidden = false;
      startBtn.disabled = true;
    }
  }

  rt.onProgress((p) => {
    if (p.phase === 'downloading') {
      const pct = p.total ? Math.round(p.received * 100 / p.total) : 0;
      bar.hidden = false; bar.className = 'bar'; barFill.style.width = pct + '%';
      setMsg('下载中 ' + pct + '%（' + (p.total ? (p.received / 1048576).toFixed(0) + ' / ' + (p.total / 1048576).toFixed(0) : (p.received / 1048576).toFixed(0)) + ' MB）');
    } else if (p.phase === 'extracting') {
      bar.hidden = false; bar.className = 'bar indeterminate'; barFill.style.width = '100%';
      hint.hidden = false;
      setMsg('下载完成，正在解压…');
    } else if (p.phase === 'error') {
      hint.hidden = true;
      setMsg('安装失败：' + p.error, 'err');
    }
  });

  downloadBtn.addEventListener('click', async () => {
    downloadBtn.disabled = true; zipBtn.disabled = true;
    downloadBtn.textContent = '安装中…';
    bar.hidden = false; barFill.style.width = '0%';
    setMsg('开始下载…');
    const r = await rt.download(url.value.trim() || null);
    downloadBtn.disabled = false; zipBtn.disabled = false;
    downloadBtn.textContent = '自动下载并安装';
    if (r.ok) { setMsg('运行环境安装完成。', 'ok'); hint.hidden = true; barFill.style.width = '100%'; }
    refresh();
  });

  zipBtn.addEventListener('click', async () => {
    zipBtn.disabled = true; downloadBtn.disabled = true;
    setMsg('正在解压，请稍候…');
    hint.hidden = false;
    bar.hidden = false; bar.className = 'bar indeterminate'; barFill.style.width = '100%';
    const r = await rt.installFromZip();
    zipBtn.disabled = false; downloadBtn.disabled = false;
    hint.hidden = true;
    if (r && !r.ok && !r.canceled) setMsg('安装失败：' + r.error, 'err');
    else if (r && r.ok) setMsg('运行环境安装完成。', 'ok');
    refresh();
  });

  startBtn.addEventListener('click', () => window.oasDesktop.wizard.done());

  refresh();
</script>
</body>
</html>
